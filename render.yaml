services:
  - type: web
    name: ai-drawing
    env: python
    plan: free
    buildCommand: |
      cd AI_Drawing
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn Ai_Drawing.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: Ai_Drawing.settings
      - key: PYTHON_VERSION
        value: 3.12.0
